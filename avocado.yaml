default_target: jetson-agx-orin
supported_targets:
  - jetson-agx-orin          # 2026 feed
  - jetson-agx-orin-devkit  # 2024 feed

extensions:
  avocado-bsp-jetson-agx-orin:
    version: 0.2.0
    release: r0
    summary: Board support for the Nvidia Jetson AGX Orin devkit
    description: Board support for the Nvidia Jetson AGX Orin devkit
    license: Apache-2.0
    url: https://github.com/avocadolinux/avocado-os
    vendor: Avocado Linux <info@avocadolinux.org>

    types:
      - sysext
      - confext

    # Carrier overlay files for tegraflash live under stone/. The DevKit
    # stone manifest declares `tegraflash_carrier_bsp: "carrier-bsp"`;
    # avocado-cli composes this entry into the runtime's effective
    # AVOCADO_STONE_INCLUDE_PATHS, scoped to this extension's location
    # (so for consumers that fetch this BSP as a remote extension, stone
    # finds the carrier files at $AVOCADO_PREFIX/includes/avocado-bsp-jetson-agx-orin/stone/).
    stone_include_paths:
      - stone

    modprobe:
      - nvme
      - nvethernet

    on_merge:
      - udevadm control --reload
      - udevadm trigger --type=subsystems --action=add --settle
      - udevadm trigger --type=devices --action=add --settle
      - nvbootctrl verify

    # Common packages: available for both kernels (linux-yocto 6.18 and
    # linux-noble-nvidia-tegra 6.8 L4T). avocado-cli auto-suffixes kernel-family
    # names with -${KERNEL_VERSION} at install time; the nv-kernel-module-*
    # RPMs (from nvidia-kernel-oot) Provide both prefixed and unprefixed
    # variants so unqualified `kernel-module-*` references resolve to the
    # in-tree package or the versioned NVIDIA OOT package on each kernel.
    packages:
      kernel-module-at24: '*'
      kernel-module-cec: '*'
      kernel-module-fusb301: '*'
      kernel-module-governor-pod-scaling: '*'
      # governor-userspace is built into the kernel (CONFIG_CPU_FREQ_GOV_USERSPACE=y)
      # on both linux-yocto 6.18 and linux-noble 6.8 — no separate module to install.
      nv-kernel-module-host1x: '*'
      kernel-module-host1x-fence: '*'
      kernel-module-host1x-nvhost: '*'
      kernel-module-ina3221: '*'
      kernel-module-mc-hwpm: '*'
      kernel-module-mc-utils: '*'
      # Ethernet stack — the onboard RJ45 on the P3737-0000 carrier is a 10GbE
      # port: Tegra234 MGBE controller (NVIDIA OOT nvethernet driver, resolved
      # via nv-kernel-module-nvethernet's `Provides: kernel-module-nvethernet`)
      # driving an Aquantia AQR113C copper PHY. The AQR113C PHY driver
      # (kernel-module-aquantia) lives in the kernel-6.18 block below — it is a
      # mainline PHY module on linux-yocto; the L4T kernel builds it in-tree.
      # realtek/r8169 cover any discrete PCIe Realtek NIC; stmmac is the
      # non-nvethernet MAC path.
      kernel-module-nvethernet: '*'
      kernel-module-realtek: '*'
      kernel-module-r8169: '*'
      kernel-module-stmmac: '*'
      kernel-module-nvgpu: '*'
      kernel-module-nvhwpm: '*'
      kernel-module-nvidia: '*'
      kernel-module-nvidia-drm: '*'
      kernel-module-nvidia-modeset: '*'
      kernel-module-nvidia-vrs-pseq: '*'
      kernel-module-nvmap: '*'
      kernel-module-nvme: '*'
      kernel-module-nvme-core: '*'
      kernel-module-nvpmodel-clk-cap: '*'
      kernel-module-nvsciipc: '*'
      kernel-module-nvvrs-pseq-rtc: '*'
      kernel-module-pcie-tegra194: '*'
      kernel-module-phy-tegra194-p2u: '*'
      kernel-module-pwm-fan: '*'
      kernel-module-pwm-tegra: '*'
      kernel-module-pwm-tegra-tachometer: '*'
      kernel-module-snd-hda-codec: '*'
      kernel-module-snd-hda-codec-hdmi: '*'
      kernel-module-snd-hda-core: '*'
      kernel-module-snd-hda-tegra: '*'
      kernel-module-snd-soc-audio-graph-card: '*'
      kernel-module-snd-soc-simple-card-utils: '*'
      kernel-module-snd-soc-tegra-audio-graph-card: '*'
      kernel-module-snd-soc-tegra-pcm: '*'
      kernel-module-snd-soc-tegra-utils: '*'
      kernel-module-snd-soc-tegra186-arad: '*'
      # In-tree ASoC modules on both linux-yocto 6.18 and linux-noble 6.8
      # (kernel-module-*, not the nv- OOT prefix). Unprefixed so they resolve
      # directly to the in-tree package on each kernel.
      kernel-module-snd-soc-tegra186-asrc: '*'
      kernel-module-snd-soc-tegra186-dspk: '*'
      kernel-module-snd-soc-tegra210-admaif: '*'
      kernel-module-snd-soc-tegra210-adx: '*'
      kernel-module-snd-soc-tegra210-ahub: '*'
      kernel-module-snd-soc-tegra210-amx: '*'
      kernel-module-snd-soc-tegra210-dmic: '*'
      kernel-module-snd-soc-tegra210-i2s: '*'
      kernel-module-snd-soc-tegra210-mixer: '*'
      kernel-module-snd-soc-tegra210-mvc: '*'
      kernel-module-snd-soc-tegra210-ope: '*'
      kernel-module-snd-soc-tegra210-sfc: '*'
      kernel-module-spi-tegra114: '*'
      kernel-module-spidev: '*'
      kernel-module-tegra-aconnect: '*'
      kernel-module-tegra-bpmp-thermal: '*'
      kernel-module-tegra-cactmon-mc-all: '*'
      kernel-module-tegra-dce: '*'
      nv-kernel-module-tegra-drm: '*'
      kernel-module-tegra-wmark: '*'
      kernel-module-tegra-xudc: '*'
      kernel-module-tegra210-adma: '*'
      kernel-module-tegra234-aon: '*'
      kernel-module-tegra234-oc-event: '*'
      kernel-module-thermal-trip-event: '*'
      kernel-module-tsecriscv: '*'
      linux-firmware-rtl8168: '*'
      swupdate: '*'
      tegra-redundant-boot-base: '*'

      # L4T GPU userspace + boot-time daemons. tegra-firmware-tegra234 (the
      # ga10b kernel firmware blobs) is delivered via
      # packagegroup-avocado-tegra-rootfs in the rootfs erofs base, *not*
      # here, because the kernel firmware loader returns -40 (ELOOP) when
      # reading firmware files through the sysext /usr overlay.
      cuda-cudart: '*'
      tegra-configs-udev: '*'
      tegra-libraries-cuda: '*'
      tegra-nvpower: '*'
      tegra-nvsciipc: '*'

    # --- 2024 feed (scarthgap) kernels -------------------------------------
    # These two blocks serve the 2024 feed only. `tegra-nvphs`, `tegra-nvstartup`
    # and `crct10dif-ce` exist in the 2024 feed but are absent (or built in) on
    # the wrynose kernels, so they are scoped here rather than left in common.

    # 5.15 (linux-jammy-nvidia-tegra, L4T r35/36).
    kernel-5.15.*:
      packages:
        nv-kernel-module-rtl8822ce: '*'
        tegra-firmware-rtl8822: '*'
        kernel-module-crct10dif-ce: '*'
        tegra-nvphs: '*'
        tegra-nvstartup: '*'

    # 6.6 (linux-yocto scarthgap) — upstream rtw88 for the 8822CE.
    kernel-6.6.*:
      packages:
        kernel-module-drm-display-helper: '*'
        kernel-module-rtw88-8822c: '*'
        kernel-module-rtw88-8822ce: '*'
        kernel-module-rtw88-core: '*'
        kernel-module-rtw88-pci: '*'
        linux-firmware-rtl8822: '*'
        kernel-module-crct10dif-ce: '*'
        tegra-nvphs: '*'
        tegra-nvstartup: '*'

    # --- 2026 feed (wrynose) kernels ---------------------------------------

    # 6.8 (linux-noble-nvidia-tegra, L4T r39.2) uses NVIDIA's downstream Realtek
    # shim for the M.2 wifi card; mainline rtw88 isn't built for this kernel.
    # Mirrors meta-tegra/conf/machine/include/devkit-wifi.inc:NVIDIA_WIFI which
    # avocado-pkg-rootfs doesn't pick up automatically (devkit-wifi.inc routes
    # via MACHINE_EXTRA_RRECOMMENDS, not MACHINE_ESSENTIAL_EXTRA_RDEPENDS).
    #
    # The L4T rtl8822ce driver expects firmware at top-level /lib/firmware
    # (rtl8822_setting.bin, rtl8822cu_fw, rtl8822cu_config) which only
    # tegra-firmware-rtl8822 ships. linux-firmware-rtl8822 ships rtl_bt/* and
    # rtw88/* — wrong path/format for the L4T driver.
    #
    # crct10dif-ce (T10-DIF CRC, ARM64 CE) is a module only on the L4T 6.8
    # kernel; linux-yocto 6.18 doesn't ship it as a separate module.
    kernel-6.8.*:
      packages:
        nv-kernel-module-rtl8822ce: '*'
        tegra-firmware-rtl8822: '*'
        kernel-module-crct10dif-ce: '*'

    # 6.18 (linux-yocto) uses the upstream rtw88 driver family for the 8822CE,
    # and ships drm-display-helper as a separate module (the L4T kernel
    # statically links the helpers into drm.ko). linux-firmware-rtl8822 ships
    # rtl_bt/* and rtw88/* firmware blobs at the paths the upstream drivers expect.
    kernel-6.18.*:
      packages:
        kernel-module-drm-display-helper: '*'
        kernel-module-rtw88-8822c: '*'
        kernel-module-rtw88-8822ce: '*'
        kernel-module-rtw88-core: '*'
        kernel-module-rtw88-pci: '*'
        linux-firmware-rtl8822: '*'
        # Onboard 10GbE MAC (Tegra234 MGBE). On linux-yocto the controller is
        # driven by mainline dwmac-tegra, NOT the OOT nvethernet listed in the
        # common block above — nvethernet is the L4T path only. dwmac-tegra is
        # the only driver that matches the DT node:
        #
        #   description: NVIDIA Tegra MGBE driver
        #   alias:       of:N*T*Cnvidia,tegra234-mgbe
        #   depends:     stmmac-platform,stmmac
        #
        # kernel-module-stmmac in the common block is only the core library and
        # binds nothing on its own, so without this the tegra234-mgbe node has
        # no driver, no eth0 appears, and the AQR113C PHY below is never even
        # probed (there is no MAC to attach it to). The RPM Requires pull
        # kernel-module-stmmac and kernel-module-stmmac-platform automatically,
        # so this one entry brings the whole MAC stack.
        # CONFIG_DWMAC_TEGRA=m comes from the tegra-kernel-cache kmeta
        # (cfg/tegra.cfg), so the package is always built for this kernel.
        kernel-module-dwmac-tegra: '*'
        # Onboard 10GbE copper PHY (Aquantia AQR113C on MGBE). Built as a
        # module on linux-yocto (CONFIG_AQUANTIA_PHY=m, from the kmeta's
        # cfg/jetson-devkit.cfg); without it the port falls back to the generic
        # Clause-45 driver, the PHY never initialises (phy_id reads 0), and the
        # link flaps. marvell10g is a safety net —
        # post-acquisition some AQR variants match the Marvell 10G driver.
        kernel-module-aquantia: '*'
        kernel-module-marvell10g: '*'

rubicon:
  # Jetson AGX Orin Developer Kit through its TOPO debug MCU (0955:7045,
  # micro-USB J26) on the Rubicon's USB port, beside the flashing port
  # (USB-C J40). boardctl, from the SDK, presses power, reset and
  # force-recovery through it: no J42 wiring. The same MCU is
  # the console (four CDC-ACM ports).
  # UNVERIFIED on a bench: boardctl's orin-jetson target for this kit, and
  # which of the TOPO's four ports is UART3 (console.port).
  # power: a relay in the kit's supply (for a USB-C PD brick, its AC side).
  # Required: the TOPO is powered by the kit, not by USB, so with the kit's
  # supply off there is nothing for boardctl to talk to (verified on a Thor
  # devkit: 0955:7045 enumerates about 2 s after power returns). It also
  # hard-resets a kit that stops answering.
  wiring:
    power: "relay in the kit's supply (AC side of the USB-C PD adapter)"
  console:
    port: 0
  run:
    # Supply off and back: clears a kit that is stuck. The kit may come up
    # on its own; the boardctl steps after it start with a forced off.
    agx-orin-power-cycle:
      - out: { power: "off" }
      - wait_ms: 5000
      - out: { power: "on" }
      - wait_ms: 3000
    # Forced off, then FORCE_RECOVERY held while ONKEY powers it up: RCM
    # from any state. Then hold the APX device (0955:7023, or 7223 on the
    # P3701-0004 module) and the flash initramfs' gadget. Exact ids, not
    # 0955:*, which would take the TOPO (the console) too.
    agx-orin-enter-recovery:
      - run: agx-orin-power-cycle
      - with_usb: { id: "0955:7045", run: [boardctl, --target, orin-jetson, recovery] }
      - hold_usb: ["0955:7023", "0955:7223", "1d6b:*"]
      - wait_usb: { id: "0955:7023", timeout_s: 60 }
    # Boot whatever is installed: forced off, then ONKEY.
    agx-orin-boot:
      - run: agx-orin-power-cycle
      - with_usb: { id: "0955:7045", run: [boardctl, --target, orin-jetson, power_on] }
      - run: agx-orin-boot-check
    agx-orin-power-off:
      - with_usb: { id: "0955:7045", run: [boardctl, --target, orin-jetson, power_off] }
    # T234 leaves RCM by itself after the flash: the check alone.
    agx-orin-boot-check:
      - console_expect:
          markers: ["Welcome to Avocado OS", "login:"]
          timeout_s: 300

provision:
  tegraflash: &rubicon
    rubicon: { before: agx-orin-enter-recovery, after: agx-orin-boot-check }
  tegraflash-emmc: *rubicon
  tegraflash-mmc: *rubicon
  tegraflash-nvme: *rubicon
  tegraflash-sd: *rubicon

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}
